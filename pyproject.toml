[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgul"
version = "1.0.0"
description = "SURgul: Safety-first Universal Risk Governance Logic"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "matplotlib>=3.4.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pydantic>=1.9.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "seaborn>=0.11.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
notebooks = [
    "ipykernel>=6.0.0",
    "ipywidgets>=7.6.0",
    "jupyter>=1.0.0",
]

[project.scripts]
surgul = "surgul.cli.trix_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["surgul*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
